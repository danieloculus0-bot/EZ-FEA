name: Deploy EZ-FEA Browser Lab
on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
  workflow_run:
    workflows: ["Frame Specimen Physics Suite", "EZ-FEA Functional Acceptance - Actual Desktop & Solver"]
    types: [completed]

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      ${{ github.event_name != 'workflow_run' ||
          (github.event.workflow_run.conclusion == 'success' &&
           github.event.workflow_run.head_branch == 'main' &&
           github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Overlay latest successful native physics evidence
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
          GH_EVENT_NAME: ${{ github.event_name }}
          TRIGGER_WORKFLOW: ${{ github.event.workflow_run.name }}
        shell: bash
        run: |
          set -euo pipefail
          runs=""
          if [[ "$GH_EVENT_NAME" == "workflow_run" && "$TRIGGER_WORKFLOW" == "Frame Specimen Physics Suite" && -n "$TRIGGER_RUN_ID" ]]; then
            runs="$TRIGGER_RUN_ID"
          else
            runs="$(gh run list --repo "$GITHUB_REPOSITORY" \
              --workflow "Frame Specimen Physics Suite" \
              --branch main --status success --limit 12 \
              --json databaseId --jq '.[].databaseId' || true)"
          fi
          found=0
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          for run in $runs; do
            # A separate extraction directory prevents GitHub CLI from
            # colliding with partially extracted files from a prior attempt.
            for attempt in 1 2; do
              download_dir="$tmpdir/${run}_${attempt}"
              mkdir -p "$download_dir"
              if gh run download "$run" --repo "$GITHUB_REPOSITORY" \
                   --name EZ-FEA-web-physics-data --dir "$download_dir"; then
                python -m scripts.verify_frame_evidence \
                  "$download_dir/frame_studies.json" --run-id "$run"
                cp "$download_dir/frame_studies.json" web/data/frame_studies.json
                echo "Loaded verified physics data from run $run"
                found=1
                break
              fi
              echo "Download of run $run failed (attempt $attempt); retrying if available."
            done
            if [[ "$found" == 1 ]]; then break; fi
          done
          if [[ "$found" == 0 ]]; then
            if [[ "$GH_EVENT_NAME" == "workflow_run" && "$TRIGGER_WORKFLOW" == "Frame Specimen Physics Suite" ]]; then
              echo "::error::Native frame solver completed, but verified frame evidence was not retrieved. Refusing stale deployment."
              exit 1
            fi
            echo "No published native dataset yet; keeping checked-in fallback."
          fi
          python -m json.tool web/data/frame_studies.json >/dev/null
      - name: Overlay genuine Warren truss STEP surface and native numerical FEA evidence
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
          GH_EVENT_NAME: ${{ github.event_name }}
          TRIGGER_WORKFLOW: ${{ github.event.workflow_run.name }}
        shell: bash
        run: |
          set -euo pipefail
          runs=""
          if [[ "$GH_EVENT_NAME" == "workflow_run" && "$TRIGGER_WORKFLOW" == "EZ-FEA Functional Acceptance - Actual Desktop & Solver" && -n "$TRIGGER_RUN_ID" ]]; then
            runs="$TRIGGER_RUN_ID"
          else
            runs="$(gh run list --repo "$GITHUB_REPOSITORY" \
              --workflow "EZ-FEA Functional Acceptance - Actual Desktop & Solver" \
              --branch main --status success --limit 8 \
              --json databaseId --jq '.[].databaseId' || true)"
          fi
          found=0
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          for run in $runs; do
            download_dir="$tmpdir/$run"
            mkdir -p "$download_dir"
            if gh run download "$run" --repo "$GITHUB_REPOSITORY" \
                 --name EZFEA-real-functional-acceptance --dir "$download_dir"; then
              source="$download_dir/real_functional_acceptance/published"
              if [[ -f "$source/truss_demo.json" && -f "$source/warren_truss.stl" ]]; then
                python -m scripts.verify_truss_web \
                  "$source/truss_demo.json" "$source/warren_truss.stl" --run-id "$run"
                cp "$source/truss_demo.json" web/data/truss_demo.json
                cp "$source/warren_truss.stl" web/data/warren_truss.stl
                echo "Published actual fused Warren STEP and verified native solver record from run $run"
                found=1
                break
              fi
              echo "Run $run lacks the generated published STEP and case bundle."
            fi
          done
          if [[ "$found" == 0 ]]; then
            if [[ "$GH_EVENT_NAME" == "workflow_run" && "$TRIGGER_WORKFLOW" == "EZ-FEA Functional Acceptance - Actual Desktop & Solver" ]]; then
              echo "::error::Fresh native truss run succeeded but published CAD/data could not be verified."
              exit 1
            fi
            echo "No verified native STEP surface artifact retrieved; showing read-only, source-linked historical truss values with accurately labeled reconstructed geometry."
          fi
      - name: Run website tests and syntax verification
        run: |
          node --test web/tests/*.test.mjs
          node --check web/truss_demo.mjs
          node --check web/truss_evidence.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static app
        uses: actions/upload-pages-artifact@v4
        with:
          path: web
      - name: Deploy static app
        id: deployment
        uses: actions/deploy-pages@v4
