name: Deploy EZ-FEA Browser Lab
on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
  workflow_run:
    workflows: ["Frame Specimen Physics Suite"]
    types: [completed]

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      ${{ github.event_name != 'workflow_run' ||
          (github.event.workflow_run.conclusion == 'success' &&
           github.event.workflow_run.head_branch == 'main' &&
           github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Overlay latest successful native physics evidence
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
          GH_EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          runs=""
          if [[ "$GH_EVENT_NAME" == "workflow_run" && -n "$TRIGGER_RUN_ID" ]]; then
            runs="$TRIGGER_RUN_ID"
          else
            runs="$(gh run list --repo "$GITHUB_REPOSITORY" \
              --workflow "Frame Specimen Physics Suite" \
              --branch main --status success --limit 12 \
              --json databaseId --jq '.[].databaseId' || true)"
          fi
          found=0
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          for run in $runs; do
            # A separate extraction directory prevents GitHub CLI from
            # colliding with partially extracted files from a prior attempt.
            for attempt in 1 2; do
              download_dir="$tmpdir/${run}_${attempt}"
              mkdir -p "$download_dir"
              if gh run download "$run" --repo "$GITHUB_REPOSITORY" \
                   --name EZ-FEA-web-physics-data --dir "$download_dir"; then
                python - "$download_dir/frame_studies.json" "$run" <<'PY'
          import json, math, pathlib, sys
          from ezfea.frame_benchmarks import STUDIES
          
          path=pathlib.Path(sys.argv[1])
          data=json.loads(path.read_text(encoding="utf-8"))
          url=f"https://github.com/danieloculus0-bot/EZ-FEA/actions/runs/{sys.argv[2]}"
          rows=data.get("studies")
          if (data.get("schema")!="ezfea.frame_evidence.v1" or
              data.get("source_run")!=url or
              not isinstance(rows,list) or
              [r.get("key") for r in rows] != [s.key for s in STUDIES]):
              raise SystemExit("Incorrect native solver evidence identity/provenance")
          for row in rows:
              if (row.get("force_balance_check")!="pass" or
                  not all(isinstance(row.get(k),(int,float)) and math.isfinite(row[k])
                          for k in ("max_displacement_mm","max_von_mises_mpa",
                                    "force_balance_relative_error")) or
                  row["max_displacement_mm"]<=0 or row["max_von_mises_mpa"]<=0 or
                  not 0<=row["force_balance_relative_error"]<=0.01):
                  raise SystemExit("Rejected incomplete/nonfinite native FEA result")
          print(f"Verified {len(rows)} genuine archived frame results from run {sys.argv[2]}")
          PY
                cp "$download_dir/frame_studies.json" web/data/frame_studies.json
                echo "Loaded verified physics data from run $run"
                found=1
                break
              fi
              echo "Download of run $run failed (attempt $attempt); retrying if available."
            done
            if [[ "$found" == 1 ]]; then break; fi
          done
          if [[ "$found" == 0 ]]; then
            if [[ "$GH_EVENT_NAME" == "workflow_run" ]]; then
              echo "::error::Native solver completed, but verified evidence was not retrieved. Refusing stale deployment."
              exit 1
            fi
            echo "No published native dataset yet; keeping checked-in fallback."
          fi
          python -m json.tool web/data/frame_studies.json >/dev/null
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static app
        uses: actions/upload-pages-artifact@v4
        with:
          path: web
      - name: Deploy static app
        id: deployment
        uses: actions/deploy-pages@v4
