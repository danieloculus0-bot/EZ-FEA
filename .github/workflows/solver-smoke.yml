name: Real 3D Solver Smoke Test
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ezfea/**"
      - "tests/test_integration.py"
      - ".github/workflows/solver-smoke.yml"
permissions:
  contents: read
jobs:
  cantilever:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install free Gmsh and CalculiX
        run: |
          sudo apt-get update
          sudo apt-get install -y calculix-ccx libglu1-mesa
          python -m pip install -r requirements.txt
      - name: Verify native solver is available
        run: |
          command -v ccx
          python -c "import gmsh; print('Gmsh', gmsh.__version__)"
      - name: Execute real 3D cantilever analysis
        env:
          EZFEA_RUN_INTEGRATION: '1'
        run: python -m unittest discover -s tests -p test_integration.py -v
