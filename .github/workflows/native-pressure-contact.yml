name: Native Pressure and Two-Body Contact Verification

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ezfea/native_pressure.py"
      - "ezfea/pressure_benchmarks.py"
      - "ezfea/contact_benchmarks.py"
      - "tests/test_native_pressure.py"
      - "tests/test_native_contact.py"
      - ".github/workflows/native-pressure-contact.yml"

permissions:
  contents: read

jobs:
  native-pressure-and-contact:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install real Gmsh and CalculiX
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y calculix-ccx libglu1-mesa
          python -m pip install -r requirements.txt
      - name: Verify tetra element face matching, pressure integration, contact input
        run: |
          python -m unittest discover -s tests -p test_native_pressure.py -v
          python -m unittest discover -s tests -p test_native_contact.py -v
      - name: Real C3D4/C3D10 pressure with force and moment reactions
        run: |
          python -m ezfea.pressure_benchmarks --out native_pressure_evidence
          cat native_pressure_evidence/PRESSURE_REPORT.md >> "$GITHUB_STEP_SUMMARY"
      - name: Two unconnected solids with and without compressive contact
        run: |
          python -m ezfea.contact_benchmarks --out two_body_contact_evidence
          cat two_body_contact_evidence/CONTACT_REPORT.md >> "$GITHUB_STEP_SUMMARY"
      - name: Archive all actual solver decks, logs, reactions and validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EZ-FEA-native-pressure-and-contact-physics
          path: |
            native_pressure_evidence/
            two_body_contact_evidence/
          if-no-files-found: warn
          retention-days: 30
